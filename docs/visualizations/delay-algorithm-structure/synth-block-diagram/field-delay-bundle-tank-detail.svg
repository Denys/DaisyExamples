<g class="block control">
<rect x="70" y="65" width="220" height="70" rx="8" fill="#f2fff6" stroke="#18a84b" stroke-width="2"/>
<text x="83" y="84" font-size="15" fill="#0c7a35" font-weight="700">Size and range controls</text>
<text x="83" y="104" font-size="13" fill="#526777">K1 SW2 Tank Size</text>
<text x="83" y="119" font-size="13" fill="#526777">base taps 37/53/71/89 ms</text>
</g>
<g class="block control">
<rect x="320" y="65" width="220" height="70" rx="8" fill="#f2fff6" stroke="#18a84b" stroke-width="2"/>
<text x="333" y="84" font-size="15" fill="#0c7a35" font-weight="700">Decay and diffusion</text>
<text x="333" y="101" font-size="15" fill="#0c7a35" font-weight="700">controls</text>
<text x="333" y="124" font-size="13" fill="#526777">K3 Decay</text>
<text x="333" y="139" font-size="13" fill="#526777">K3 SW1 Diffusion</text>
</g>
<g class="block control">
<rect x="570" y="65" width="220" height="90" rx="8" fill="#f2fff6" stroke="#18a84b" stroke-width="2"/>
<text x="583" y="84" font-size="15" fill="#0c7a35" font-weight="700">Damping and color controls</text>
<text x="583" y="104" font-size="13" fill="#526777">K4 HF Damp</text>
<text x="583" y="119" font-size="13" fill="#526777">K4 SW1 Damping</text>
<text x="583" y="134" font-size="13" fill="#526777">K5 Tank Color</text>
</g>
<g class="block control">
<rect x="820" y="65" width="220" height="70" rx="8" fill="#f2fff6" stroke="#18a84b" stroke-width="2"/>
<text x="833" y="84" font-size="15" fill="#0c7a35" font-weight="700">Width and pre-delay</text>
<text x="833" y="101" font-size="15" fill="#0c7a35" font-weight="700">controls</text>
<text x="833" y="124" font-size="13" fill="#526777">K2 SW1 Width</text>
<text x="833" y="139" font-size="13" fill="#526777">K1 SW1 Pre Delay</text>
</g>
<g class="block control">
<rect x="1070" y="65" width="220" height="90" rx="8" fill="#f2fff6" stroke="#18a84b" stroke-width="2"/>
<text x="1083" y="84" font-size="15" fill="#0c7a35" font-weight="700">Bundle gain controls</text>
<text x="1083" y="104" font-size="13" fill="#526777">K1 Mix</text>
<text x="1083" y="119" font-size="13" fill="#526777">K7 Input drive</text>
<text x="1083" y="134" font-size="13" fill="#526777">K8 Output</text>
</g>
<g class="block pitch">
<rect x="65" y="350" width="145" height="90" rx="8" fill="#f3f7fa" stroke="#34495e" stroke-width="2"/>
<text x="78" y="369" font-size="15" fill="#172026" font-weight="700">Algorithm input</text>
<text x="78" y="389" font-size="13" fill="#526777">audio in +</text>
<text x="78" y="404" font-size="13" fill="#526777">internal synth</text>
<text x="78" y="419" font-size="13" fill="#526777">left/right samples</text>
</g>
<g class="block mixer">
<rect x="255" y="335" width="170" height="110" rx="8" fill="#f7fbff" stroke="#008fd3" stroke-width="2"/>
<text x="268" y="354" font-size="15" fill="#008fd3" font-weight="700">Driven mono input</text>
<text x="268" y="374" font-size="13" fill="#526777">(L + R) * 0.5</text>
<text x="268" y="389" font-size="13" fill="#526777">drive * 0.55</text>
</g>
<g class="block processor">
<rect x="485" y="335" width="175" height="110" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<text x="498" y="354" font-size="15" fill="#14242c" font-weight="700">Diffusion injector</text>
<text x="498" y="374" font-size="13" fill="#526777">input * diffusion</text>
<text x="498" y="389" font-size="13" fill="#526777">feeds every tank line</text>
</g>
<g class="block processor">
<rect x="485" y="500" width="200" height="105" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<text x="498" y="519" font-size="15" fill="#14242c" font-weight="700">Four delay-line reads</text>
<text x="498" y="539" font-size="13" fill="#526777">base taps scaled by size</text>
<text x="498" y="554" font-size="13" fill="#526777">lines 0..3</text>
</g>
<g class="block processor">
<rect x="760" y="500" width="185" height="105" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<text x="773" y="519" font-size="15" fill="#14242c" font-weight="700">Per-line damping</text>
<text x="773" y="539" font-size="13" fill="#526777">one-pole damping state</text>
<text x="773" y="554" font-size="13" fill="#526777">a, b, c, d taps</text>
</g>
<g class="block processor">
<rect x="1015" y="500" width="220" height="105" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<text x="1028" y="519" font-size="15" fill="#14242c" font-weight="700">Hadamard feedback mix</text>
<text x="1028" y="539" font-size="13" fill="#526777">h0..h3 sum/difference</text>
<text x="1028" y="554" font-size="13" fill="#526777">scaled by decay</text>
</g>
<g class="block note">
<rect x="760" y="335" width="220" height="110" rx="8" fill="#f8fbfd" stroke="#8aa0ad" stroke-width="2"/>
<text x="773" y="354" font-size="15" fill="#172026" font-weight="700">Four feedback writes</text>
<text x="773" y="374" font-size="13" fill="#526777">diffuse input + matrix terms</text>
<text x="773" y="389" font-size="13" fill="#526777">writes delay lines 0..3</text>
</g>
<g class="block mixer">
<rect x="1305" y="455" width="190" height="105" rx="8" fill="#f7fbff" stroke="#008fd3" stroke-width="2"/>
<text x="1318" y="474" font-size="15" fill="#008fd3" font-weight="700">Stereo width and early</text>
<text x="1318" y="491" font-size="15" fill="#008fd3" font-weight="700">mix</text>
<text x="1318" y="514" font-size="13" fill="#526777">left = a + c</text>
<text x="1318" y="529" font-size="13" fill="#526777">right = b + d</text>
<text x="1318" y="544" font-size="13" fill="#526777">width + pre-delay</text>
</g>
<g class="block output">
<rect x="1110" y="705" width="210" height="70" rx="8" fill="#fff5f5" stroke="#e33b3b" stroke-width="2"/>
<text x="1123" y="724" font-size="15" fill="#d82121" font-weight="700">Bundle dry/wet and gain</text>
<text x="1123" y="744" font-size="13" fill="#526777">mix, bypass, wet-only,</text>
<text x="1123" y="759" font-size="13" fill="#526777">output dB</text>
</g>
<g class="block output">
<rect x="1390" y="705" width="170" height="70" rx="8" fill="#fff5f5" stroke="#e33b3b" stroke-width="2"/>
<text x="1403" y="724" font-size="15" fill="#d82121" font-weight="700">Audio Out L/R</text>
<text x="1403" y="744" font-size="13" fill="#526777">returned to Field DAC</text>
</g>
