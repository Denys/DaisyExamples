<text x="598" y="669" font-size="15" fill="#172026" font-weight="700">April UI runtime</text>
<text x="598" y="689" font-size="13" fill="#526777">SW1 is hold-alt; pickup/catch threshold 0.02</text>
<text x="598" y="704" font-size="13" fill="#526777">OLED, key LEDs, and knob LEDs update from 1 ms loop</text>
</g>
