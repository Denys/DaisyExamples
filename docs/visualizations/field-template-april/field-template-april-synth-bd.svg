<text x="1248" y="679" font-size="13" fill="#526777">show stored values, captured state,</text>
<text x="1248" y="694" font-size="13" fill="#526777">selections</text>
<text x="1248" y="709" font-size="13" fill="#526777">B5 also mirrors note/sustain state</text>
</g>
