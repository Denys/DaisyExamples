<text x="1053" y="319" font-size="15" fill="#14242c" font-weight="700">SVF LPF</text>
<text x="1053" y="339" font-size="13" fill="#526777">base cutoff +</text>
<text x="1053" y="354" font-size="13" fill="#526777">env</text>
<text x="1053" y="369" font-size="13" fill="#526777">+ keytrack + LFO</text>
<text x="1053" y="384" font-size="13" fill="#526777">resonance</text>
<text x="1053" y="399" font-size="13" fill="#526777">0.15-0.95</text>
