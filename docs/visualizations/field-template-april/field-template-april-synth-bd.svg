<text x="58" y="352" font-size="15" fill="#172026" font-weight="700">Pitch + gate</text>
<text x="58" y="372" font-size="13" fill="#526777">external MIDI only</text>
<text x="58" y="387" font-size="13" fill="#526777">target frequency</text>
<text x="58" y="402" font-size="13" fill="#526777">transpose + glide</text>
<text x="58" y="417" font-size="13" fill="#526777">smoothing</text>
<text x="58" y="432" font-size="13" fill="#526777">A7 Pitch LFO in</text>
<text x="58" y="447" font-size="13" fill="#526777">frequency math</text>
</g>
