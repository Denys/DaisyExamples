<g class="block control">
<rect x="40" y="35" width="225" height="108" rx="8" fill="#f2fff6" stroke="#18a84b" stroke-width="2"/>
<text x="53" y="54" font-size="15" fill="#0c7a35" font-weight="700">Note / gate controls</text>
<text x="53" y="74" font-size="13" fill="#526777">External MIDI notes, velocity,</text>
<text x="53" y="89" font-size="13" fill="#526777">CC64</text>
<text x="53" y="104" font-size="13" fill="#526777">B1-B4 transpose controls</text>
<text x="53" y="119" font-size="13" fill="#526777">B5 panic, B6-B8 resets</text>
</g>
