<text x="828" y="544" font-size="13" fill="#526777">K3 Attack, K4 Decay</text>
<text x="828" y="559" font-size="13" fill="#526777">K5 Sustain, K6 Release</text>
<path d="M847 599 L887 575 L927 589 H967 L1042 599" fill="none" stroke="#f07a20" stroke-width="3"/>
</g>
