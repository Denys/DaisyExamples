name: Build All

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Initialize build submodules
      run: |
        git submodule update --init --depth 1 DaisySP libDaisy stmlib third_party/CloudSeedCore
        git -C DaisySP submodule update --init --depth 1 DaisySP-LGPL
        git -C third_party/CloudSeedCore apply --unidiff-zero ../CloudSeedCore-daisy.patch
    - name: arm-none-eabi-gcc
      uses: fiam/arm-none-eabi-gcc@v1
      with:
        release: '10-2020-q4'
    - name: Build Libraries
      run: ./ci/build_libs.sh
    - name: setup python
      uses: actions/setup-python@v6
      with:
        python-version: 3.8
    - name: Build Examples
      run: python ./ci/build_examples.py
    - name: Create Distributable Binaries
      run: python ./ci/build_dist.py -ru
    - name: Deploy Dist
      if: github.event_name == 'push'
      uses: EndBug/add-and-commit@v10
      with:
        message: 'Automated: Committing Dist folder' 
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
